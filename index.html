<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WLAN Login</title>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            background-color: #f5f5f7;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 360px;
            width: 100%;
        }
        h1 { font-size: 24px; margin-bottom: 10px; color: #1d1d1f; }
        p { font-size: 14px; color: #86868b; margin-bottom: 25px; line-height: 1.4; }
        
        /* Die blaue Fläche, die in Wahrheit der QR-Code ist */
        .qr-button-container {
            display: inline-block;
            background-color: #0071e3;
            padding: 20px;
            border-radius: 16px;
            transition: background-color 0.2s;
        }
        .qr-button-container:active {
            background-color: #005bb5;
        }
        .qr-image {
            width: 200px;
            height: 200px;
            display: block;
            /* Macht den QR-Code weiß-transparent, damit er auf dem blauen Button cool aussieht */
            filter: invert(1) contrast(100); 
        }
        .hint {
            font-size: 12px;
            color: #86868b;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Gäste-WLAN</h1>
    <p><strong>Für iPhones:</strong> Drücke 1 Sekunde lang fest auf das blaue Feld und wähle im Menü <br><strong>"Netzwerk beitreten"</strong>.</p>
    
    <!-- Die blaue Fläche mit dem integrierten QR-Code -->
    <div class="qr-button-container">
        <!-- ERSETZE UNTEN: DEIN_WLAN_NAME und DEIN_WLAN_PASSWORT -->
        <img class="qr-image" src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=WIFI:S:Celine;T:WPA;P:celinejustin0106;;" alt="WLAN QR Code">
    </div>

    <p class="hint">(Android-Nutzer können das Feld einfach mit der Kamera scannen)</p>
</div>

</body>
</html>
