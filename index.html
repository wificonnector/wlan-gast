<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Willkommen im WLAN</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 { color: #1d1d1f; font-size: 24px; margin-bottom: 10px; }
        p { color: #86868b; font-size: 14px; margin-bottom: 30px; }
        
        /* Die gewünschte blaue Fläche */
        .wifi-button {
            display: block;
            background-color: #0071e3;
            color: white;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            transition: background-color 0.2s;
            cursor: pointer;
            border: none;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 25px;
        }
        .wifi-button:hover { background-color: #0077ed; }
        
        .qr-section {
            border-top: 1px solid #d2d2d7;
            padding-top: 20px;
            margin-top: 10px;
        }
        .qr-code {
            width: 180px;
            height: 180px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Inaktiv im WLAN anmelden</h1>
    <p>Tippe auf die blaue Fläche, um dich direkt mit dem Gäste-WLAN zu verbinden.</p>

    <!-- Trigger für den Apple Kurzbefehl -->
    <!-- Ersetze 'WLAN-Verbinden' durch den exakten Namen deines Kurzbefehls -->
    <a href="shortcuts://run-shortcut?name=WLAN-Verbinden" class="wifi-button">
        Mit WLAN verbinden (iPhone)
    </a>

    <div class="qr-section">
        <p style="margin-bottom: 10px;">Alternative für Android oder falls es nicht klappt:</p>
        <!-- Hier generieren wir dynamisch einen passenden WLAN QR-Code -->
        <!-- ERSETZE UNTEN: DEIN_WLAN_NAME und DEIN_WLAN_PASSWORT -->
        <img class="qr-code" src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=WIFI:S:DEIN_WLAN_NAME;T:WPA;P:DEIN_WLAN_PASSWORT;;" alt="WLAN QR Code">
    </div>
</div>

</body>
</html>
