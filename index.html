<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WLAN Login</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            
            /* HINTERGRUNDBILD */
            background-image: url('hintergrund.JPEG'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #f5f5f7; 
            
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        
        .container {
            /* Die äußere Box bleibt exakt so groß wie in deiner Vorlage */
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            max-width: 360px;
            width: 100%;
            height: 380px; /* Feste Höhe, damit die Box durch das Schrumpfen des Inhalts nicht kollabiert */
            box-sizing: border-box;
            
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* DIESER BEREICH SCHRUMPFT DEN GESAMTEN INHALT UM 60% */
        .scaled-content {
            transform: scale(0.4); /* Skaliert auf 40% (also 60% kleiner) */
            transform-origin: center;
            width: 100%;
            text-align: center;
            flex-shrink: 0;
        }
        
        /* Die originalen Styles aus deiner Vorlage (bleiben unberührt, werden nur mitskaliert) */
        h1 { font-size: 24px; margin-bottom: 8px; color: #1d1d1f; font-weight: 600; margin-top: 0; }
        p { font-size: 14px; color: #1d1d1f; margin-bottom: 25px; line-height: 1.4; } 
        
        .wifi-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #0071e3;
            padding: 20px;
            border-radius: 18px;
            text-decoration: none;
            color: white;
            transition: background-color 0.2s, transform 0.1s;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 113, 227, 0.3);
        }
        
        .wifi-button:active {
            background-color: #005bb5;
            transform: scale(0.98);
        }
        
        .button-text {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 15px;
            letter-spacing: -0.2px;
        }
        
        .qr-image {
            width: 160px;
            height: 160px;
            display: block;
            filter: invert(1) contrast(100); 
            border-radius: 8px;
        }
        
        .hint {
            font-size: 12px;
            color: #1d1d1f; 
            margin-top: 20px;
            margin-bottom: 0;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="scaled-content">
        <h1>Gäste-WLAN</h1>
        <p>Willkommen bei uns zu Hause! Halte den Daumen einfach <strong>kurz gedrückt</strong> auf dem blauen Button, um dich zu verbinden.</p>
        
        <div class="wifi-button">
            <span class="button-text">Gedrückt halten zum Verbinden</span>
            
            <img class="qr-image" src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=WIFI:S:Celine;T:WPA;P:DEIN_WLAN_PASSWORT;;" alt="WLAN QR Code">
        </div>

        <p class="hint">(Android-Nutzer können den Code einfach direkt mit der Kamera scannen)</p>
    </div>
</div>

</body>
</html>
