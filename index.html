<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WLAN Login Mini</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            
            /* HINTERGRUNDBILD ANPASSEN */
            /* Stelle sicher, dass deine Bilddatei exakt so heißt wie hier angegeben (z.B. hintergrund.jpg) 
               und im gleichen Ordner liegt */
            background-image: url('hintergrund.jpg'); 
            
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            
            /* Fallback-Farbe */
            background-color: #f5f5f7; 
            
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        
        .container {
            /* Das Hauptelement, das die Karte enthält.
               Um den Inhalt um 60% zu verkleinern, skalieren wir den Container. */
            transform: scale(0.4); /* Skaliert auf 40% (60% kleiner) */
            transform-origin: center; /* Hält alles in der Mitte */
            
            background: rgba(255, 255, 255, 0.75); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            
            /* Basisgröße vor der Skalierung */
            max-width: 360px; 
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }
        
        /* Die inneren Elemente bleiben in ihrer relativen Größe gleich, 
           da sie mit dem Container skaliert werden. */
        h1 { 
            font-size: 24px; 
            margin-top: 0;
            margin-bottom: 8px; 
            color: #1d1d1f; 
            font-weight: 600; 
        }
        
        p { 
            font-size: 14px; 
            color: #1d1d1f; 
            margin-bottom: 25px; 
            line-height: 1.3; 
        }
        
        .wifi-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #0071e3;
